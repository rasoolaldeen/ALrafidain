<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة رسول الدين</title>
<style>
:root{--bg:#171009;--panel:#21170d;--card:#2a1f11;--gold:#e8bb55;--dim:#8a6a2a;--text:#f2e6c9;--sub:#b9a67c;--danger:#d9583a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#30210e 0,#171009 38%,#0d0905 100%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1150px;margin:auto;padding:18px}.panel{background:linear-gradient(180deg,#24190e,#171009);border:1px solid #5c421d;border-radius:20px}.gold{color:var(--gold)}.muted{color:var(--sub)}.btn{min-height:44px;border-radius:12px;border:1px solid var(--dim);background:#1b130b;color:var(--text);padding:10px 14px}.btn.goldbtn{background:var(--gold);color:#171009;font-weight:800}.btn.danger{border-color:#7b2c20;color:#ff9a83}.field{width:100%;min-height:44px;border-radius:11px;border:1px solid #6d5121;background:#100b07;color:var(--text);padding:10px}.field:focus{outline:2px solid var(--gold)}label{display:block;font-size:13px;color:var(--sub)}label .field{margin-top:6px}.login{max-width:370px;margin:9vh auto;padding:25px;text-align:center}.login-logo,.logo{object-fit:contain;background:#100b07;border:2px solid currentColor}.login-logo{width:90px;height:90px;border-radius:50%;padding:7px;color:var(--gold)}.logo{width:52px;height:52px;border-radius:50%;padding:4px}.logo-fallback{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;background:#100b07;font-weight:900}.top{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--dim)}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{padding:18px 20px}.section-title{display:flex;align-items:center;gap:10px;margin-bottom:13px}.section-title i{height:1px;background:var(--dim);flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid currentColor;border-radius:15px;background:linear-gradient(180deg,#2a1f11,#1b130b);padding:12px;display:flex;align-items:center;gap:12px;text-align:right;color:var(--gold);min-height:78px}.card:hover{filter:brightness(1.08)}.card-main{flex:1;min-width:0}.card b{display:block;color:var(--text);font-size:15px}.card small{display:block;color:var(--sub);margin-top:5px;white-space:normal}.badge{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:11px;margin-top:5px}.crumb{font-size:13px;color:var(--sub);margin-bottom:14px}.toolbar{display:flex;justify-content:flex-start;margin-bottom:10px}.searchbox{display:flex;align-items:center;gap:6px}.searchtoggle{width:44px;height:44px;padding:0;font-size:19px}.searchinput{width:0;min-height:42px;padding:0;border:0;opacity:0;pointer-events:none;transition:width .18s ease,opacity .18s ease,padding .18s ease,border .18s ease}.searchbox.open .searchinput,.searchbox:focus-within .searchinput{width:min(260px,60vw);padding:9px 11px;border:1px solid #6d5121;opacity:1;pointer-events:auto}.modalbg{position:fixed;inset:0;background:rgba(7,4,2,.86);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:linear-gradient(#261a0e,#140e08);border:1px solid var(--gold);border-radius:20px;padding:20px;box-shadow:0 20px 70px #000}.modal.sm{width:min(400px,100%);text-align:center}.settings{width:min(1000px,100%)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tab.active{background:var(--gold);color:#171009;font-weight:bold}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.list{display:grid;gap:8px;margin-top:14px}.row{background:#1d140b;border:1px solid #5d431c;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .grow{flex:1;min-width:170px}.swatch{width:17px;height:17px;border-radius:50%;display:inline-block;vertical-align:middle;border:1px solid #fff5}.preview{width:72px;height:72px;object-fit:contain;border-radius:12px;border:1px solid var(--dim);background:#100b07;padding:5px}.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{padding:12px;text-align:center;background:#1c140b;border:1px solid #5c421d;border-radius:12px}.stat b{display:block;font-size:22px;color:var(--gold)}.note{background:#15100b;border-right:3px solid var(--gold);padding:10px;border-radius:8px}.owner-note{border:1px dashed var(--dim);padding:10px;border-radius:10px;margin-top:10px}.switch{display:flex;align-items:center;gap:8px;color:var(--text)}.switch input{width:18px;height:18px}.footer{padding:16px 20px;border-top:1px solid var(--dim);font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.empty{padding:18px;border:1px dashed #5c421d;border-radius:12px;color:var(--sub);text-align:center}.toast{position:fixed;left:18px;bottom:18px;background:#24190e;border:1px solid var(--gold);padding:12px 16px;border-radius:12px;z-index:90}.ownerbar{background:#2a1e0e;border-bottom:1px solid var(--gold);padding:9px 20px;font-size:13px}.status-ready{color:#74c97b}.status-review{color:#e8bb55}.status-new{color:#67b7e8}.status-archive{color:#aaa}.category{margin:18px 0 8px;color:var(--gold);font-weight:bold;border-bottom:1px solid #5d431c;padding-bottom:7px}.login .field{margin-bottom:12px}.passwordbox{position:relative}.passwordbox .field{padding-left:48px}.eye{position:absolute;left:5px;top:6px;border:0;background:transparent;color:var(--gold);height:34px;width:38px}.help{font-size:12px;color:var(--sub);line-height:1.7}.coloroption{display:flex;gap:8px;align-items:center}.templatebox{display:flex;gap:7px;flex-wrap:wrap}.dangerzone{border:1px solid #713325;padding:12px;border-radius:12px;margin-top:14px}
@media(max-width:720px){.grid,.two,.three{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}.wrap{padding:8px}.section,.top{padding:14px}.login{margin:4vh auto}.modal{padding:14px}.actions{width:100%}.actions .btn{flex:1}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const KEY='rafidain_v7_draft';
const COLORS={gold:['ذهبي','#e8bb55'],blue:['أزرق','#4a8fd6'],indigo:['نيلي','#5367c9'],sky:['سماوي','#55aeca'],green:['أخضر','#5fae5f'],orange:['برتقالي','#d9793a'],red:['أحمر','#c75c4c'],purple:['بنفسجي','#925fc2'],pink:['وردي','#c25fae'],gray:['رمادي','#8e8e8e']};
const defaultState=()=>({branding:{company:'شركة بوابة الرافدين لتجهيز مواد البناء',welcome:'مرحباً بك',subtitle:'الرجاء تسجيل الدخول للمتابعة',footer:'بوابة الشركات والحسابات',loginLogo:'',siteLogo:''},users:[{id:'owner',username:'رسول الدين',password:'1324',owner:true}],items:[
{id:'c1',parent:null,section:'company',type:'dashboard',name:'بوابة الرافدين',desc:'الملفات والحسابات الداخلية',color:'orange',icon:'BR',logo:'',link:'',active:true,status:'ready',allowed:['owner'],order:1,note:'',updated:new Date().toISOString()},
{id:'c2',parent:null,section:'company',type:'link',name:'انهار البصرة',desc:'الحسابات والكشوفات',color:'gold',icon:'AB',logo:'',link:'',active:true,status:'review',allowed:['owner'],order:2,note:'',updated:new Date().toISOString()},
{id:'l1',parent:null,section:'ledger',type:'link',name:'الديون والسلف والأقساط',desc:'متابعة السلف والأقساط',color:'gold',icon:'💳',logo:'',link:'',active:true,status:'review',allowed:['owner'],order:1,note:'',updated:new Date().toISOString()},
{id:'s1',parent:'c1',section:'internal',type:'link',name:'الكشوفات الشهرية',desc:'عرض الكشوفات الشهرية',category:'الكشوفات',color:'gold',icon:'📊',logo:'',link:'',active:true,status:'review',allowed:['owner'],order:1,note:'',updated:new Date().toISOString()},
{id:'s2',parent:'c1',section:'internal',type:'link',name:'السلف المستلمة',desc:'عرض السلف المستلمة',category:'السلف والأقساط',color:'blue',icon:'💵',logo:'',link:'',active:true,status:'review',allowed:['owner'],order:2,note:'',updated:new Date().toISOString()},
{id:'s3',parent:'c1',section:'internal',type:'link',name:'الأقساط الشهرية',desc:'عرض الأقساط الشهرية',category:'السلف والأقساط',color:'green',icon:'🧾',logo:'',link:'',active:true,status:'review',allowed:['owner'],order:3,note:'',updated:new Date().toISOString()}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch(e){S=defaultState()}S.logs=Array.isArray(S.logs)?S.logs:[];let user=null,path=[],previewUser=null,editing=null,editUser=null;
const app=document.getElementById('app'); const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}; function logChange(text){S.logs=Array.isArray(S.logs)?S.logs:[];S.logs.unshift({at:new Date().toISOString(),text});S.logs=S.logs.slice(0,20);save()}
function esc(v=''){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2200)}function uid(p='i'){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function curUser(){return previewUser||user}function isOwner(){return !!user?.owner&&!previewUser}function statusText(s){return {ready:'جاهز ✓',review:'قيد التدقيق ⏳',new:'محدث حديثاً ●',archive:'مؤرشف'}[s]||''}function colorOf(k){return (COLORS[k]||COLORS.gold)[1]}function canSee(i){const u=curUser();return u&&(u.owner||i.allowed.includes(u.id))&&i.active}function children(pid){return S.items.filter(i=>i.parent===pid&&canSee(i)).sort((a,b)=>(a.order||0)-(b.order||0))}function topItems(sec){return S.items.filter(i=>!i.parent&&i.section===sec&&canSee(i)).sort((a,b)=>(a.order||0)-(b.order||0))}function logo(i){return i.logo?`<img class="logo" src="${i.logo}" alt="">`:`<span class="logo-fallback" style="color:${colorOf(i.color)}">${esc(i.icon||'📁')}</span>`}
function login(){app.innerHTML=`<div class="wrap"><form id="login" class="panel login"><div id="loginLogo">${S.branding.loginLogo?`<img class="login-logo" src="${S.branding.loginLogo}" alt="شعار">`:`<div class="login-logo" style="display:grid;place-items:center;font-size:36px;margin:auto">🏗️</div>`}</div><div class="muted" style="margin-top:12px">${esc(S.branding.company)}</div><h1 class="gold">${esc(S.branding.welcome)}</h1><p class="muted">${esc(S.branding.subtitle)}</p><label>اسم المستخدم<input id="lu" class="field" autocomplete="off" name="raf-user-${Date.now()}"></label><label>كلمة السر<div class="passwordbox"><input id="lp" type="password" class="field" autocomplete="new-password" name="raf-pass-${Date.now()}"><button class="eye" type="button" data-eye="lp">👁</button></div></label><div id="err" class="hidden" style="color:#ff927a;margin-bottom:10px">اسم المستخدم أو كلمة السر غير صحيحة</div><button class="btn goldbtn" style="width:100%">دخول</button><div class="help" style="margin-top:14px">${esc(S.branding.footer)}</div></form></div>`;bindEyes();document.getElementById('login').onsubmit=e=>{e.preventDefault();const n=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;const u=S.users.find(x=>x.username===n&&x.password===p);if(!u)return document.getElementById('err').classList.remove('hidden');user=u;previewUser=null;path=[];render()}}
function render(){if(!user)return login();const u=curUser();const pid=path.length?path[path.length-1]:null;const dash=pid?S.items.find(i=>i.id===pid):null;app.innerHTML=`<div class="wrap"><div class="panel">${previewUser?`<div class="ownerbar">👁 وضع المعاينة كمستخدم: <b>${esc(previewUser.username)}</b> — <button class="btn" id="stopPreview">العودة للمالك</button></div>`:''}<header class="top"><div style="display:flex;align-items:center;gap:14px">${S.branding.siteLogo?`<img src="${S.branding.siteLogo}" alt="لوكو الموقع" style="width:64px;height:64px;object-fit:contain;border-radius:12px;border:1px solid var(--gold-dim);padding:4px;background:#120d08">`:''}<div><div class="muted">${esc(S.branding.company)}</div><h2 class="gold" style="margin:5px 0">${dash?esc(dash.name):'لوحة الشركات والحسابات'}</h2><div class="muted">مرحباً، ${esc(u.username)}${u.owner?' — المالك / المحاسب العام':''}</div></div></div><div class="actions">${path.length?'<button class="btn" id="back">↩ رجوع</button>':''}${user.owner&&!previewUser?'<button class="btn" id="settings">⚙ الإعدادات</button>':''}<button class="btn danger" id="logout">⏻ خروج</button></div></header><main class="section">${dashboardBody(pid)}</main><footer class="footer"><span>إدارة النظام: رسول الدين</span></footer></div></div>`;bindMain()}
function dashboardBody(pid){let items=pid?children(pid):[...topItems('company'),...topItems('ledger')];let h=`<div class="toolbar"><div class="searchbox" id="searchBox"><button type="button" id="searchToggle" class="btn searchtoggle" title="بحث" aria-label="فتح البحث">🔎</button><input id="search" class="field searchinput" placeholder="بحث سريع..." aria-label="بحث سريع في العناصر"></div></div>`;if(pid){const d=S.items.find(i=>i.id===pid);h+=`<div class="crumb">الرئيسية ← ${path.map(id=>esc(S.items.find(i=>i.id===id)?.name||'')).join(' ← ')}</div>${d?.desc?`<p class="muted">${esc(d.desc)}</p>`:''}`;const cats=[...new Set(items.map(i=>i.category||'عام'))];h+=`<div id="itemArea">${cats.map(c=>`<div class="category">${esc(c)}</div><div class="grid">${items.filter(i=>(i.category||'عام')===c).map(card).join('')||'<div class="empty">لا توجد عناصر</div>'}</div>`).join('')}</div>`}else{const cs=topItems('company'),ls=topItems('ledger');h+=`<div id="itemArea">${cs.length?`<div class="section-title"><b>الشركات الرئيسية</b><i></i><small class="muted">${cs.length}</small></div><div class="grid">${cs.map(card).join('')}</div>`:''}${ls.length?`<div class="section-title" style="margin-top:${cs.length?'24px':'0'}"><b>المعامل والديون والوكلاء</b><i></i><small class="muted">${ls.length}</small></div><div class="grid">${ls.map(card).join('')}</div>`:''}${!cs.length&&!ls.length?'<div class="empty">لا توجد عناصر متاحة لهذا المستخدم.</div>':''}</div>`}return h}
function card(i){return `<div class="card" data-name="${esc((i.name+' '+(i.desc||'')+' '+(i.category||'')).toLowerCase())}" style="color:${colorOf(i.color)}">${logo(i)}<button class="card-main" style="border:0;background:none;text-align:right;color:inherit;padding:0" data-open="${i.id}"><b>${esc(i.name)}</b>${i.desc?`<small>${esc(i.desc)}</small>`:''}<span class="badge status-${i.status}">${statusText(i.status)}</span>${isOwner()&&i.type==='link'&&!i.link?'<span class="badge" style="color:#ff9a83;margin-right:6px">⚠ لا يوجد رابط</span>':''}</button><span>‹</span></div>`}
function bindMain(){document.getElementById('logout').onclick=()=>{user=null;previewUser=null;path=[];login()};document.getElementById('settings')?.addEventListener('click',settings);document.getElementById('back')?.addEventListener('click',()=>{path.pop();render()});document.getElementById('stopPreview')?.addEventListener('click',()=>{previewUser=null;path=[];render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(b.dataset.open));const box=document.getElementById('searchBox'),toggle=document.getElementById('searchToggle'),search=document.getElementById('search');if(toggle&&box&&search){toggle.onclick=()=>{box.classList.toggle('open');if(box.classList.contains('open'))search.focus();else{search.value='';filterCards('')}};search.oninput=e=>filterCards(e.target.value);search.onblur=()=>{if(!search.value.trim())setTimeout(()=>box.classList.remove('open'),120)}}}
function filterCards(value){const q=(value||'').trim().toLowerCase();document.querySelectorAll('.card[data-name]').forEach(c=>c.style.display=!q||c.dataset.name.includes(q)?'flex':'none')}
function openItem(id){const i=S.items.find(x=>x.id===id);if(!i)return;if(i.type==='dashboard'){path.push(id);return render()}confirmLink(i)}
function confirmLink(i){const has=!!i.link;modal(`<div class="modal sm">${logo(i)}<h2 class="gold">${esc(i.name)}</h2>${has?`<p>هل تود الاستمرار بعرض الملفات؟</p><div class="two"><button class="btn goldbtn" id="continue">متابعة</button><button class="btn" data-close>إلغاء</button></div>`:`<p><b>المواد قيد التدقيق</b></p><p class="muted">المواد والمعلومات قيد المراجعة بواسطة المحاسب رسول الدين.</p><button class="btn" data-close>إغلاق</button>`}</div>`);if(has)document.getElementById('continue').onclick=()=>{window.open(i.link,'_blank','noopener');closeModal()}}
function modal(html){const d=document.createElement('div');d.id='modalbg';d.className='modalbg';d.innerHTML=html;document.body.appendChild(d);d.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);d.addEventListener('click',e=>{if(e.target===d)closeModal()})}function closeModal(){document.getElementById('modalbg')?.remove()}
function settings(){editing=null;editUser=null;modal(`<div class="modal settings"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 class="gold" style="margin:0">الإعدادات المتقدمة</h2><small class="muted">تظهر للمالك رسول الدين فقط</small></div><button class="btn" data-close>✕</button></div><div class="tabs"><button class="btn tab active" data-tab="summary">الملخص</button><button class="btn tab" data-tab="items">العناصر</button><button class="btn tab" data-tab="users">المستخدمون</button><button class="btn tab" data-tab="welcome">صفحة الترحيب</button><button class="btn tab" data-tab="backup">النسخ الاحتياطي</button><button class="btn tab" data-tab="preview">معاينة كمستخدم</button><button class="btn tab" data-tab="check">فحص النظام</button><button class="btn tab" data-tab="logs">سجل التغييرات</button></div><div id="settingsBody"></div></div>`);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');settingsTab(b.dataset.tab)});settingsTab('summary')}
function settingsTab(t){const b=document.getElementById('settingsBody');if(!b)return;if(t==='summary'){const active=S.items.filter(i=>i.active).length,ready=S.items.filter(i=>i.link&&i.active).length,pending=S.items.filter(i=>!i.link&&i.type==='link'&&i.active).length,dashes=S.items.filter(i=>i.type==='dashboard'&&i.active).length;b.innerHTML=`<div class="statgrid"><div class="stat"><b>${S.items.filter(i=>!i.parent&&i.section==='company').length}</b>الشركات</div><div class="stat"><b>${dashes}</b>الداشبوردات</div><div class="stat"><b>${S.users.length}</b>المستخدمون</div><div class="stat"><b>${ready}</b>روابط جاهزة</div><div class="stat"><b>${pending}</b>قيد التدقيق</div></div><div class="note" style="margin-top:14px">العناصر النشطة حالياً: ${active}. يمكنك إخفاء أي عنصر مؤقتاً بدون حذفه.</div>`;return}if(t==='items'){itemsAdmin(b);return}if(t==='users'){usersAdmin(b);return}if(t==='welcome'){welcomeAdmin(b);return}if(t==='backup'){backupAdmin(b);return}if(t==='preview'){previewAdmin(b);return}if(t==='check'){checkAdmin(b);return}if(t==='logs'){logsAdmin(b);return}}
function colorOptions(sel='gold'){return Object.entries(COLORS).map(([k,[n,c]])=>`<option value="${k}" ${k===sel?'selected':''}>${n} — ${c}</option>`).join('')}
function permissionChecks(sel=['owner']){return S.users.map(u=>`<label class="switch"><input type="checkbox" name="perm" value="${u.id}" ${(u.owner||sel.includes(u.id))?'checked':''} ${u.owner?'disabled':''}>${esc(u.username)}${u.owner?' (المالك)':''}</label>`).join('')}
function itemsAdmin(b){b.innerHTML=`<div class="templatebox"><button class="btn" data-template="blank">＋ داشبورد فارغ</button><button class="btn" data-template="months">📅 قالب كشوفات شهرية</button><button class="btn" data-template="loans">💰 قالب سلف وأقساط</button></div><form id="itemForm" style="margin-top:14px"><input id="eid" type="hidden"><div class="three"><label>اسم العنصر<input id="iname" class="field" required></label><label>النوع<select id="itype" class="field"><option value="link">زر / رابط</option><option value="dashboard">داشبورد داخلي</option></select></label><label>القسم<select id="isection" class="field"><option value="company">الشركات الرئيسية</option><option value="ledger">المعامل والديون والوكلاء</option><option value="internal">داخل داشبورد</option></select></label><label>داخل أي داشبورد؟<select id="iparent" class="field"><option value="">بدون</option>${S.items.filter(i=>i.type==='dashboard').map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></label><label>التصنيف الداخلي<input id="icat" class="field" placeholder="مثال: الكشوفات"></label><label>اللون<select id="icolor" class="field">${colorOptions()}</select></label><label>الأيقونة / الأحرف<input id="iicon" class="field" value="📁"></label><label>الحالة<select id="istatus" class="field"><option value="ready">جاهز</option><option value="review">قيد التدقيق</option><option value="new">محدث حديثاً</option><option value="archive">مؤرشف</option></select></label><label>الترتيب<input id="iorder" type="number" class="field" value="1" min="1"></label></div><div class="two" style="margin-top:12px"><label>الوصف المختصر<input id="idesc" class="field"></label><label>الرابط اليدوي<input id="ilink" class="field" type="url" placeholder="https://..."></label></div><div class="two" style="margin-top:12px"><label>رفع لوكو<input id="ilogo" class="field" type="file" accept="image/*"></label><div><span class="muted">معاينة اللوكو</span><div><img id="logoPrev" class="preview hidden" alt="معاينة"></div></div></div><label style="margin-top:12px">ملاحظات خاصة بالمالك<textarea id="inote" class="field" rows="2"></textarea></label><div class="two" style="margin-top:12px"><label class="switch"><input id="iactive" type="checkbox" checked>العنصر نشط / ظاهر</label><div><span class="muted">صلاحيات الظهور</span><div class="actions" style="margin:6px 0"><button type="button" class="btn" id="permAll">تحديد الكل</button><button type="button" class="btn" id="permNone">إلغاء تحديد الكل</button></div><div id="perms" class="row">${permissionChecks()}</div></div></div><div class="actions" style="margin-top:14px"><button class="btn goldbtn" id="saveItem">حفظ العنصر</button><button type="button" class="btn hidden" id="cancelEdit">إلغاء التعديل</button></div></form><div class="list" id="itemList"></div>`;renderItemList();document.getElementById('itemForm').onsubmit=saveItem;document.getElementById('cancelEdit').onclick=()=>itemsAdmin(b);document.getElementById('ilogo').onchange=e=>readImage(e.target.files[0],src=>{document.getElementById('logoPrev').src=src;document.getElementById('logoPrev').classList.remove('hidden');document.getElementById('logoPrev').dataset.value=src});document.querySelectorAll('[data-template]').forEach(x=>x.onclick=()=>makeTemplate(x.dataset.template));document.getElementById('permAll').onclick=()=>document.querySelectorAll('input[name=perm]').forEach(x=>x.checked=true);document.getElementById('permNone').onclick=()=>document.querySelectorAll('input[name=perm]').forEach(x=>{if(!x.disabled)x.checked=false})}
function renderItemList(){const x=document.getElementById('itemList');if(!x)return;x.innerHTML=S.items.slice().sort((a,b)=>(a.parent||'').localeCompare(b.parent||'')+(a.order||0)-(b.order||0)).map(i=>`<div class="row"><div style="color:${colorOf(i.color)}">${logo(i)}</div><div class="grow"><b>${esc(i.name)}</b><small class="muted" style="display:block">${i.type==='dashboard'?'داشبورد داخلي':'رابط'} · ${i.active?'ظاهر':'مخفي'} · ${statusText(i.status)}${i.parent?' · داخل '+esc(S.items.find(p=>p.id===i.parent)?.name||''):''}</small>${i.note?`<small class="gold">🔒 ${esc(i.note)}</small>`:''}</div>${i.link?`<button class="btn" data-test="${i.id}">🧪 اختبار</button>`:''}<button class="btn" data-copy="${i.id}">⧉ نسخ</button>${i.type==='dashboard'?`<button class="btn" data-clone="${i.id}">⧉ استنساخ كامل</button>`:''}<button class="btn" data-edit="${i.id}">✎</button><button class="btn danger" data-del="${i.id}">🗑</button></div>`).join('');x.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItemForm(b.dataset.edit));x.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyItem(b.dataset.copy,false));x.querySelectorAll('[data-clone]').forEach(b=>b.onclick=()=>copyItem(b.dataset.clone,true));x.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{const i=S.items.find(x=>x.id===b.dataset.test);if(i?.link)window.open(i.link,'_blank','noopener')});x.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.del))}
function saveItem(e){e.preventDefault();const id=document.getElementById('eid').value||uid(),old=S.items.find(i=>i.id===id),parent=document.getElementById('iparent').value||null,type=document.getElementById('itype').value,allowed=['owner',...Array.from(document.querySelectorAll('input[name=perm]:checked')).map(x=>x.value).filter(x=>x!=='owner')];const prev=document.getElementById('logoPrev');const obj={id,parent,section:parent?'internal':document.getElementById('isection').value,type,name:document.getElementById('iname').value.trim(),desc:document.getElementById('idesc').value.trim(),category:document.getElementById('icat').value.trim(),color:document.getElementById('icolor').value,icon:document.getElementById('iicon').value.trim()||'📁',logo:prev.dataset.value||old?.logo||'',link:type==='dashboard'?'':document.getElementById('ilink').value.trim(),active:document.getElementById('iactive').checked,status:document.getElementById('istatus').value,allowed,order:Math.max(1,parseInt(document.getElementById('iorder').value)||1),note:document.getElementById('inote').value.trim(),updated:new Date().toISOString()};const n=S.items.findIndex(i=>i.id===id);n>=0?S.items[n]=obj:S.items.push(obj);logChange((old?'تم تعديل العنصر: ':'تمت إضافة العنصر: ')+obj.name);toast('تم حفظ العنصر');itemsAdmin(document.getElementById('settingsBody'))}
function editItemForm(id){const i=S.items.find(x=>x.id===id);if(!i)return;['eid','iname','idesc','icat','iicon','ilink','inote','iorder'].forEach(k=>{});document.getElementById('eid').value=i.id;document.getElementById('iname').value=i.name;document.getElementById('itype').value=i.type;document.getElementById('isection').value=i.section;document.getElementById('iparent').value=i.parent||'';document.getElementById('icat').value=i.category||'';document.getElementById('icolor').value=i.color;document.getElementById('iicon').value=i.icon||'';document.getElementById('istatus').value=i.status;document.getElementById('iorder').value=i.order||1;document.getElementById('idesc').value=i.desc||'';document.getElementById('ilink').value=i.link||'';document.getElementById('inote').value=i.note||'';document.getElementById('iactive').checked=i.active;document.getElementById('perms').innerHTML=permissionChecks(i.allowed);if(i.logo){const p=document.getElementById('logoPrev');p.src=i.logo;p.dataset.value=i.logo;p.classList.remove('hidden')}document.getElementById('cancelEdit').classList.remove('hidden');document.getElementById('saveItem').textContent='حفظ التعديلات';document.getElementById('itemForm').scrollIntoView({behavior:'smooth'})}
function copyItem(id,deep){const src=S.items.find(i=>i.id===id);if(!src)return;const nid=uid();S.items.push({...src,id:nid,name:src.name+' - نسخة',order:(src.order||1)+1,updated:new Date().toISOString()});if(deep){const cs=S.items.filter(i=>i.parent===id);cs.forEach(c=>S.items.push({...c,id:uid(),parent:nid,updated:new Date().toISOString()}))}logChange((deep?'تم استنساخ الداشبورد: ':'تم نسخ العنصر: ')+src.name);renderItemList();toast(deep?'تم استنساخ الداشبورد ومحتوياته':'تم نسخ العنصر')}
function deleteItem(id){const i=S.items.find(x=>x.id===id),count=S.items.filter(x=>x.parent===id).length;if(!i)return;const msg=count?`هذا الداشبورد يحتوي على ${count} عنصر. سيتم حذفها معه. هل أنت متأكد؟`:`هل أنت متأكد من حذف «${i.name}»؟`;if(!confirm(msg))return;S.items=S.items.filter(x=>x.id!==id&&x.parent!==id);logChange('تم حذف العنصر: '+i.name);renderItemList();toast('تم الحذف')}
function makeTemplate(kind){if(kind==='blank'){document.getElementById('itype').value='dashboard';document.getElementById('iname').value='داشبورد جديد';return}const dashId=uid();const name=kind==='months'?'الكشوفات الشهرية':'السلف والأقساط';S.items.push({id:dashId,parent:null,section:'company',type:'dashboard',name,desc:'داشبورد داخلي',category:'',color:'gold',icon:'📂',logo:'',link:'',active:true,status:'ready',allowed:['owner'],order:S.items.length+1,note:'',updated:new Date().toISOString()});if(kind==='months'){['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'].forEach((m,k)=>S.items.push({id:uid(),parent:dashId,section:'internal',type:'link',name:'كشف '+m,desc:'',category:'الكشوفات الشهرية',color:'gold',icon:'📄',logo:'',link:'',active:true,status:'review',allowed:['owner'],order:k+1,note:'',updated:new Date().toISOString()}))}else{['السلف المستلمة','الأقساط الشهرية','الديون','التسديدات'].forEach((m,k)=>S.items.push({id:uid(),parent:dashId,section:'internal',type:'link',name:m,desc:'',category:'السلف والأقساط',color:k%2?'green':'blue',icon:'💵',logo:'',link:'',active:true,status:'review',allowed:['owner'],order:k+1,note:'',updated:new Date().toISOString()}))}logChange('تم إنشاء قالب جاهز: '+name);renderItemList();toast('تم إنشاء القالب الجاهز')}
function usersAdmin(b){b.innerHTML=`<form id="uf"><div class="three"><label>اسم المستخدم<input id="un" class="field" required></label><label>كلمة السر<div class="passwordbox"><input id="up" type="password" class="field" required autocomplete="new-password"><button type="button" class="eye" data-eye="up">👁</button></div></label><div style="align-self:end"><button class="btn goldbtn" style="width:100%">إضافة مستخدم</button></div></div></form><div class="list">${S.users.map(u=>`<div class="row"><div class="grow"><b>${esc(u.username)}</b><small class="muted" style="display:block">${u.owner?'المالك — صلاحية كاملة':'مستخدم'}</small></div><button class="btn" data-pass="${u.id}">🔑 تغيير كلمة السر</button>${u.owner?'':'<button class="btn danger" data-udel="'+u.id+'">🗑</button>'}</div>`).join('')}</div>`;bindEyes();document.getElementById('uf').onsubmit=e=>{e.preventDefault();const n=document.getElementById('un').value.trim(),p=document.getElementById('up').value;if(S.users.some(u=>u.username===n))return toast('اسم المستخدم موجود مسبقاً');S.users.push({id:uid('u'),username:n,password:p,owner:false});logChange('تمت إضافة المستخدم: '+n);usersAdmin(b);toast('تمت إضافة المستخدم')};b.querySelectorAll('[data-pass]').forEach(x=>x.onclick=()=>changePass(x.dataset.pass));b.querySelectorAll('[data-udel]').forEach(x=>x.onclick=()=>{if(!confirm('حذف المستخدم؟'))return;const id=x.dataset.udel;S.users=S.users.filter(u=>u.id!==id);S.items.forEach(i=>i.allowed=i.allowed.filter(a=>a!==id));logChange('تم حذف مستخدم');usersAdmin(b)})}
function changePass(id){const u=S.users.find(x=>x.id===id);const p=prompt('أدخل كلمة السر الجديدة للمستخدم: '+u.username);if(p===null)return;if(!p)return toast('كلمة السر لا يمكن أن تكون فارغة');u.password=p;logChange('تم تغيير كلمة السر للمستخدم: '+u.username);toast('تم تغيير كلمة السر')}
function welcomeAdmin(b){b.innerHTML=`<form id="wf"><div class="two"><label>اسم الشركة<input id="bc" class="field" value="${esc(S.branding.company)}"></label><label>عبارة الترحيب<input id="bw" class="field" value="${esc(S.branding.welcome)}"></label><label>النص أسفل الترحيب<input id="bs" class="field" value="${esc(S.branding.subtitle)}"></label><label>النص السفلي<input id="bf" class="field" value="${esc(S.branding.footer)}"></label><label>لوكو صفحة تسجيل الدخول<input id="blogo" type="file" accept="image/*" class="field"></label><div><span class="muted">معاينة لوكو الدخول</span><div>${S.branding.loginLogo?`<img id="bprev" class="preview" src="${S.branding.loginLogo}">`:'<img id="bprev" class="preview hidden">'}</div></div><label>لوكو الموقع الرئيسي<input id="slogo" type="file" accept="image/*" class="field"></label><div><span class="muted">معاينة لوكو الموقع</span><div>${S.branding.siteLogo?`<img id="sprev" class="preview" src="${S.branding.siteLogo}">`:'<img id="sprev" class="preview hidden">'}</div></div></div><div class="actions" style="margin-top:14px"><button class="btn goldbtn">حفظ صفحة الترحيب</button><button type="button" id="removeLogo" class="btn">إزالة لوكو الدخول</button><button type="button" id="removeSiteLogo" class="btn">إزالة لوكو الموقع</button></div></form>`;let logo=S.branding.loginLogo,siteLogo=S.branding.siteLogo||'';document.getElementById('blogo').onchange=e=>readImage(e.target.files[0],src=>{logo=src;const p=document.getElementById('bprev');p.src=src;p.classList.remove('hidden')});document.getElementById('slogo').onchange=e=>readImage(e.target.files[0],src=>{siteLogo=src;const p=document.getElementById('sprev');p.src=src;p.classList.remove('hidden')});document.getElementById('removeLogo').onclick=()=>{logo='';document.getElementById('bprev').classList.add('hidden')};document.getElementById('removeSiteLogo').onclick=()=>{siteLogo='';document.getElementById('sprev').classList.add('hidden')};document.getElementById('wf').onsubmit=e=>{e.preventDefault();S.branding={company:document.getElementById('bc').value.trim(),welcome:document.getElementById('bw').value.trim(),subtitle:document.getElementById('bs').value.trim(),footer:document.getElementById('bf').value.trim(),loginLogo:logo,siteLogo:siteLogo};logChange('تم تعديل صفحة الترحيب');save();toast('تم حفظ صفحة الترحيب');closeModal();render()}}
function backupAdmin(b){b.innerHTML=`<div class="note">النسخة الاحتياطية تشمل الإعدادات والمستخدمين والصلاحيات والروابط واللوغوات. احفظ نسخة قبل تحديث GitHub.</div><div class="two" style="margin-top:14px"><button class="btn goldbtn" id="export">⬇ تصدير نسخة احتياطية JSON</button><label class="btn" style="text-align:center">⬆ استعادة نسخة<input id="import" type="file" accept=".json,application/json" class="hidden"></label></div><div class="dangerzone"><b>إعادة ضبط النظام</b><p class="muted">يعيد النسخة الافتراضية ويحذف التعديلات المحلية في هذا المتصفح.</p><button class="btn danger" id="reset">إعادة الضبط</button></div>`;document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!n.users||!n.items||!n.branding)throw 0;S=n;save();toast('تمت الاستعادة');closeModal();render()}catch(_){toast('ملف النسخة غير صالح')}};r.readAsText(f)};document.getElementById('reset').onclick=()=>{if(confirm('متأكد من إعادة ضبط النظام؟')){S=defaultState();save();user=S.users[0];closeModal();render()}}}
function previewAdmin(b){const others=S.users.filter(u=>!u.owner);b.innerHTML=others.length?`<p class="muted">اختر مستخدماً لترى بالضبط العناصر التي ستظهر له، بدون تسجيل خروج.</p><div class="list">${others.map(u=>`<div class="row"><div class="grow"><b>${esc(u.username)}</b></div><button class="btn goldbtn" data-prev="${u.id}">معاينة</button></div>`).join('')}</div>`:`<div class="empty">أضف مستخدماً أولاً حتى تستخدم المعاينة.</div>`;b.querySelectorAll('[data-prev]').forEach(x=>x.onclick=()=>{previewUser=S.users.find(u=>u.id===x.dataset.prev);path=[];closeModal();render()})}

function checkAdmin(b){const issues=[];S.items.filter(i=>i.active&&i.type==='link'&&!i.link).forEach(i=>issues.push('⚠ «'+i.name+'» بدون رابط'));S.items.filter(i=>i.active&&i.type==='dashboard'&&!S.items.some(x=>x.parent===i.id&&x.active)).forEach(i=>issues.push('⚠ الداشبورد «'+i.name+'» فارغ'));S.users.filter(u=>!u.owner&&!S.items.some(i=>i.active&&i.allowed.includes(u.id))).forEach(u=>issues.push('⚠ المستخدم «'+u.username+'» لا يملك صلاحية لأي عنصر'));S.items.filter(i=>!i.active).forEach(i=>issues.push('ℹ العنصر «'+i.name+'» مخفي'));b.innerHTML=`<div class="note">فحص سريع للإعدادات قبل النسخ الاحتياطي أو الرفع إلى GitHub. لا يغيّر أي شيء.</div><div class="list">${issues.length?issues.map(x=>`<div class="row"><div class="grow">${esc(x)}</div></div>`).join(''):'<div class="empty">✓ لم يتم العثور على ملاحظات واضحة.</div>'}</div>`}
function logsAdmin(b){const logs=Array.isArray(S.logs)?S.logs:[];b.innerHTML=`<div class="note">آخر 20 تغييراً مسجلاً محلياً للمالك.</div><div class="list">${logs.length?logs.map(l=>`<div class="row"><div class="grow"><b>${esc(l.text)}</b><small class="muted" style="display:block">${new Date(l.at).toLocaleString('ar-IQ')}</small></div></div>`).join(''):'<div class="empty">لا توجد تغييرات مسجلة بعد.</div>'}</div>`}
function readImage(file,cb){if(!file)return;if(file.size>2*1024*1024)return toast('حجم الصورة كبير. اختر صورة أقل من 2MB');const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}function bindEyes(){document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);i.type=i.type==='password'?'text':'password'})}
async function boot(){
  // إذا توجد تعديلات محلية محفوظة في هذا المتصفح، لا نستبدلها بملف data.json عند كل تحديث للصفحة.
  // data.json يُستخدم فقط كبداية على الأجهزة/المتصفحات التي لا تملك نسخة محلية بعد.
  let local=null;
  try{local=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(local&&Array.isArray(local.users)&&Array.isArray(local.items)&&local.branding){
    S=local;
  }else{
    try{
      const r=await fetch('./data.json?ts='+Date.now(),{cache:'no-store'});
      if(r.ok){
        const n=await r.json();
        if(n&&Array.isArray(n.users)&&Array.isArray(n.items)&&n.branding){S=n;save()}
      }
    }catch(e){}
  }
  S.branding=S.branding||{};
  S.branding.siteLogo=S.branding.siteLogo||'';
  S.branding.loginLogo=S.branding.loginLogo||'';
  S.logs=Array.isArray(S.logs)?S.logs:[];
  login();
}boot();})();
</script></body></html>
