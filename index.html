<style>
:root{--bg:#171009;--panel:#21170d;--card:#2a1f11;--gold:#e8bb55;--dim:#8a6a2a;--text:#f2e6c9;--sub:#b9a67c;--danger:#d9583a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#30210e 0,#171009 38%,#0d0905 100%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1150px;margin:auto;padding:18px}.panel{background:linear-gradient(180deg,#24190e,#171009);border:1px solid #5c421d;border-radius:20px}.gold{color:var(--gold)}.muted{color:var(--sub)}.btn{min-height:44px;border-radius:12px;border:1px solid var(--dim);background:#1b130b;color:var(--text);padding:10px 14px}.btn.goldbtn{background:var(--gold);color:#171009;font-weight:800}.btn.danger{border-color:#7b2c20;color:#ff9a83}.field{width:100%;min-height:44px;border-radius:11px;border:1px solid #6d5121;background:#100b07;color:var(--text);padding:10px}.field:focus{outline:2px solid var(--gold)}label{display:block;font-size:13px;color:var(--sub)}label .field{margin-top:6px}.login{max-width:370px;margin:9vh auto;padding:25px;text-align:center}.login-logo,.logo{object-fit:contain;background:#100b07;border:2px solid currentColor}.login-logo{width:90px;height:90px;border-radius:50%;padding:7px;color:var(--gold)}.logo{width:52px;height:52px;border-radius:50%;padding:4px}.logo-fallback{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;background:#100b07;font-weight:900}.top{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--dim)}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{padding:18px 20px}.section-title{display:flex;align-items:center;gap:10px;margin-bottom:13px}.section-title i{height:1px;background:var(--dim);flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid currentColor;border-radius:15px;background:linear-gradient(180deg,#2a1f11,#1b130b);padding:12px;display:flex;align-items:center;gap:12px;text-align:right;color:var(--gold);min-height:78px}.card:hover{filter:brightness(1.08)}.card-main{flex:1;min-width:0}.card b{display:block;color:var(--text);font-size:15px}.card small{display:block;color:var(--sub);margin-top:5px;white-space:normal}.badge{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:11px;margin-top:5px}.crumb{font-size:13px;color:var(--sub);margin-bottom:14px}.toolbar{display:flex;justify-content:flex-start;margin-bottom:10px}.searchbox{display:flex;align-items:center;gap:6px}.searchtoggle{width:44px;height:44px;padding:0;font-size:19px}.searchinput{width:0;min-height:42px;padding:0;border:0;opacity:0;pointer-events:none;transition:width .18s ease,opacity .18s ease,padding .18s ease,border .18s ease}.searchbox.open .searchinput,.searchbox:focus-within .searchinput{width:min(260px,60vw);padding:9px 11px;border:1px solid #6d5121;opacity:1;pointer-events:auto}.modalbg{position:fixed;inset:0;background:rgba(7,4,2,.86);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:linear-gradient(#261a0e,#140e08);border:1px solid var(--gold);border-radius:20px;padding:20px;box-shadow:0 20px 70px #000}.modal.sm{width:min(400px,100%);text-align:center}.settings{width:min(1000px,100%)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tab.active{background:var(--gold);color:#171009;font-weight:bold}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.list{display:grid;gap:8px;margin-top:14px}.row{background:#1d140b;border:1px solid #5d431c;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .grow{flex:1;min-width:170px}.swatch{width:17px;height:17px;border-radius:50%;display:inline-block;vertical-align:middle;border:1px solid #fff5}.preview{width:72px;height:72px;object-fit:contain;border-radius:12px;border:1px solid var(--dim);background:#100b07;padding:5px}.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{padding:12px;text-align:center;background:#1c140b;border:1px solid #5c421d;border-radius:12px}.stat b{display:block;font-size:22px;color:var(--gold)}.note{background:#15100b;border-right:3px solid var(--gold);padding:10px;border-radius:8px}.owner-note{border:1px dashed var(--dim);padding:10px;border-radius:10px;margin-top:10px}.switch{display:flex;align-items:center;gap:8px;color:var(--text)}.switch input{width:18px;height:18px}.footer{padding:16px 20px;border-top:1px solid var(--dim);font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.empty{padding:18px;border:1px dashed #5c421d;border-radius:12px;color:var(--sub);text-align:center}.toast{position:fixed;left:18px;bottom:18px;background:#24190e;border:1px solid var(--gold);padding:12px 16px;border-radius:12px;z-index:90}.ownerbar{background:#2a1e0e;border-bottom:1px solid var(--gold);padding:9px 20px;font-size:13px}.status-ready{color:#74c97b}.status-review{color:#e8bb55}.status-new{color:#67b7e8}.status-archive{color:#aaa}.category{margin:18px 0 8px;color:var(--gold);font-weight:bold;border-bottom:1px solid #5d431c;padding-bottom:7px}.login .field{margin-bottom:12px}.passwordbox{position:relative}.passwordbox .field{padding-left:48px}.eye{position:absolute;left:5px;top:6px;border:0;background:transparent;color:var(--gold);height:34px;width:38px}.help{font-size:12px;color:var(--sub);line-height:1.7}.coloroption{display:flex;gap:8px;align-items:center}.templatebox{display:flex;gap:7px;flex-wrap:wrap}.dangerzone{border:1px solid #713325;padding:12px;border-radius:12px;margin-top:14px}

/* Animated welcome emblem */
.login{position:relative;isolation:isolate;overflow:visible}
.login-emblem{position:relative;width:min(250px,70vw);height:210px;margin:-20px auto 2px;display:grid;place-items:center;isolation:isolate;pointer-events:none}
.login-emblem::before{content:"";position:absolute;inset:8% 4%;z-index:-2;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 12%,#ffc16088 18%,transparent 26% 42%,#ff8b3e66 51%,transparent 59% 72%,#ffe19b88 80%,transparent 90%);filter:blur(22px);animation:emblem-spin 13s linear infinite}
.login-emblem::after{content:"";position:absolute;width:82%;height:18%;bottom:5%;left:9%;z-index:-1;border:1px solid #e79d3966;border-radius:50%;box-shadow:0 0 18px #edac4477,inset 0 0 16px #e79d3944;transform:perspective(160px) rotateX(65deg);animation:emblem-floor 4s ease-in-out infinite}
.emblem-orbit{position:absolute;width:166px;height:166px;border-radius:50%;border:1px solid #efaa4788;box-shadow:0 0 12px #efa84755,inset 0 0 10px #ffce7055;animation:emblem-spin 10s linear infinite}
.emblem-orbit::before,.emblem-orbit::after{content:"";position:absolute;border-radius:50%;background:#fff3bd;box-shadow:0 0 8px 3px #ffd486,0 0 26px 8px #e9943c}
.emblem-orbit::before{width:7px;height:7px;top:12px;left:25px}.emblem-orbit::after{width:4px;height:4px;bottom:13px;right:25px}
.emblem-orbit.second{width:188px;height:188px;border-color:#b5693166;border-left-color:#ffd17a;box-shadow:none;animation-duration:16s;animation-direction:reverse}
.emblem-orbit.second::before{top:35px;right:12px;left:auto;width:5px;height:5px;background:#ffb56e}.emblem-orbit.second::after{display:none}
.login-emblem .login-logo{position:relative;z-index:1;width:158px;height:158px;display:block;margin:auto;padding:0;border-radius:50%;border:1px solid #e9ab55;object-fit:cover;background:#140b05;box-shadow:0 0 0 5px #1b1009,0 0 18px 4px #f9bd65aa,0 0 42px 12px #d47a3544;animation:emblem-breathe 4s ease-in-out infinite}
@keyframes emblem-spin{to{transform:rotate(360deg)}}
@keyframes emblem-breathe{50%{box-shadow:0 0 0 5px #1b1009,0 0 28px 8px #ffd184cc,0 0 58px 16px #e38a4b66}}
@keyframes emblem-floor{50%{opacity:.55;transform:perspective(160px) rotateX(65deg) scale(.85)}}
@media(max-width:480px){.login-emblem{height:190px;margin-top:-14px}.login-emblem .login-logo{width:142px;height:142px}.emblem-orbit{width:150px;height:150px}.emblem-orbit.second{width:172px;height:172px}}
@media(prefers-reduced-motion:reduce){.login-emblem::before,.login-emblem::after,.emblem-orbit,.login-emblem .login-logo{animation:none}}

/* Owner-controlled visual effects */
body.logo-effects-off .login-emblem::before,body.logo-effects-off .login-emblem::after,body.logo-effects-off .emblem-orbit{display:none}
body.logo-effects-off .login-emblem .login-logo{animation:none;box-shadow:0 0 0 5px #1b1009}
.card{position:relative;isolation:isolate;transition:transform .25s,box-shadow .25s}
body.card-effects-on .card:hover{transform:translateY(-2px)}
body.card-effects-on .card::before{content:"";position:absolute;inset:-2px;border-radius:17px;padding:2px;pointer-events:none;background:conic-gradient(from var(--card-angle),transparent 0 18%,var(--effect-color-one) 27%,transparent 38% 57%,var(--effect-color-two) 70%,transparent 83%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;filter:drop-shadow(0 0 7px var(--effect-color-one));animation:card-border-sweep var(--card-effect-time,6s) linear infinite}
body.card-effects-on .card{box-shadow:0 0 12px color-mix(in srgb,var(--effect-color-one) 22%,transparent),inset 0 0 14px color-mix(in srgb,var(--effect-color-two) 10%,transparent);animation:card-light-pulse var(--card-effect-time,6s) ease-in-out infinite}
@property --card-angle{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes card-border-sweep{to{--card-angle:360deg}}
@keyframes card-light-pulse{50%{box-shadow:0 0 21px color-mix(in srgb,var(--effect-color-two) 42%,transparent),inset 0 0 18px color-mix(in srgb,var(--effect-color-one) 20%,transparent)}}
body{--effect-color-one:#ffbe59;--effect-color-two:#58c9ff;--card-effect-time:6s;--logo-effect-time:1}
.login-emblem::before{animation-duration:calc(13s / var(--logo-effect-time))}.login-emblem::after,.login-emblem .login-logo{animation-duration:calc(4s / var(--logo-effect-time))}.emblem-orbit{animation-duration:calc(10s / var(--logo-effect-time))}.emblem-orbit.second{animation-duration:calc(16s / var(--logo-effect-time))}
@media(prefers-reduced-motion:reduce){body.card-effects-on .card,body.card-effects-on .card::before{animation:none}}

function esc(v=''){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2200)}function uid(p='i'){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function curUser(){return previewUser||user}function isOwner(){return !!user?.owner&&!previewUser}function statusText(s){return {ready:'جاهز ✓',review:'قيد التدقيق ⏳',new:'محدث حديثاً ●',archive:'مؤرشف'}[s]||''}function colorOf(k){return (COLORS[k]||COLORS.gold)[1]}function canSee(i){const u=curUser();return u&&(u.owner||i.allowed.includes(u.id))&&i.active}function children(pid){return S.items.filter(i=>i.parent===pid&&canSee(i)).sort((a,b)=>(a.order||0)-(b.order||0))}function topItems(sec){return S.items.filter(i=>!i.parent&&i.section===sec&&canSee(i)).sort((a,b)=>(a.order||0)-(b.order||0))}function logo(i){return i.logo?`<img class="logo" src="${i.logo}" alt="">`:`<span class="logo-fallback" style="color:${colorOf(i.color)}">${esc(i.icon||'📁')}</span>`}

function dashboardBody(pid){let items=pid?children(pid):[...topItems('company'),...topItems('ledger')];let h=`<div class="toolbar"><div class="searchbox" id="searchBox"><button type="button" id="searchToggle" class="btn searchtoggle" title="بحث" aria-label="فتح البحث">🔎</button><input id="search" class="field searchinput" placeholder="بحث سريع..." aria-label="بحث سريع في العناصر"></div></div>`;if(pid){const d=S.items.find(i=>i.id===pid);h+=`<div class="crumb">الرئيسية ← ${path.map(id=>esc(S.items.find(i=>i.id===id)?.name||'')).join(' ← ')}</div>${d?.desc?`<p class="muted">${esc(d.desc)}</p>`:''}`;const cats=[...new Set(items.map(i=>i.category||'عام'))];h+=`<div id="itemArea">${cats.map(c=>`<div class="category">${esc(c)}</div><div class="grid">${items.filter(i=>(i.category||'عام')===c).map(card).join('')||'<div class="empty">لا توجد عناصر</div>'}</div>`).join('')}</div>`}else{const cs=topItems('company'),ls=topItems('ledger');h+=`<div id="itemArea">${cs.length?`<div class="section-title"><b>الشركات الرئيسية</b><i></i><small class="muted">${cs.length}</small></div><div class="grid">${cs.map(card).join('')}</div>`:''}${ls.length?`<div class="section-title" style="margin-top:${cs.length?'24px':'0'}"><b>المعامل والديون والوكلاء</b><i></i><small class="muted">${ls.length}</small></div><div class="grid">${ls.map(card).join('')}</div>`:''}${!cs.length&&!ls.length?'<div class="empty">لا توجد عناصر متاحة لهذا المستخدم.</div>':''}</div>`}return h}

function itemsAdmin(b){b.innerHTML=`<div class="templatebox"><button class="btn" data-template="blank">＋ داشبورد فارغ</button><button class="btn" data-template="months">📅 قالب كشوفات شهرية</button><button class="btn" data-template="loans">💰 قالب سلف وأقساط</button></div><form id="itemForm" style="margin-top:14px"><input id="eid" type="hidden"><div class="three"><label>اسم العنصر<input id="iname" class="field" required></label><label>النوع<select id="itype" class="field"><option value="link">زر / رابط</option><option value="dashboard">داشبورد داخلي</option></select></label><label>القسم<select id="isection" class="field"><option value="company">الشركات الرئيسية</option><option value="ledger">المعامل والديون والوكلاء</option><option value="internal">داخل داشبورد</option></select></label><label>داخل أي داشبورد؟<select id="iparent" class="field"><option value="">بدون</option>${S.items.filter(i=>i.type==='dashboard').map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></label><label>التصنيف الداخلي<input id="icat" class="field" placeholder="مثال: الكشوفات"></label><label>اللون<select id="icolor" class="field">${colorOptions()}</select></label><label>الأيقونة / الأحرف<input id="iicon" class="field" value="📁"></label><label>الحالة<select id="istatus" class="field"><option value="ready">جاهز</option><option value="review">قيد التدقيق</option><option value="new">محدث حديثاً</option><option value="archive">مؤرشف</option></select></label><label>الترتيب<input id="iorder" type="number" class="field" value="1" min="1"></label></div><div class="two" style="margin-top:12px"><label>الوصف المختصر<input id="idesc" class="field"></label><label>الرابط اليدوي<input id="ilink" class="field" type="url" placeholder="https://..."></label></div><div class="two" style="margin-top:12px"><label>رفع لوكو<input id="ilogo" class="field" type="file" accept="image/*"></label><div><span class="muted">معاينة اللوكو</span><div><img id="logoPrev" class="preview hidden" alt="معاينة" function changePass(id){const u=S.users.find(x=>x.id===id);const p=prompt('أدخل كلمة السر الجديدة للمستخدم: '+u.username);if(p===null)return;if(!p)return toast('كلمة السر لا يمكن أن تكون فارغة');u.password=p;logChange('تم تغيير كلمة السر للمستخدم: '+u.username);toast('تم تغيير كلمة السر')}

ault();S.branding={company:document.getElementById('bc').value.trim(),welcome:document.getElementById('bw').value.trim(),subtitle:document.getElementById('bs').value.trim(),footer:document.getElementById('bf').value.trim(),loginLogo:logo,siteLogo:siteLogo};logChange('تم تعديل صفحة الترحيب');save();applyAppIcon();toast('تم حفظ صفحة الترحيب');closeModal();render()}}
function backupAdmin(b){b.innerHTML=`<div class="note">النسخة الاحتياطية تشمل الإعدادات والمستخدمين والصلاحيات والروابط واللوغوات. احفظ نسخة قبل تحديث GitHub.</div><div class="two" style="margin-top:14px"><button class="btn goldbtn" id="export">⬇ تصدير نسخة احتياطية JSON</button><label class="btn" style="text-align:center">⬆ استعادة نسخة<input id="import" type="file" accept=".json,application/json" class="hidden"></label></div><div class="dangerzone"><b>إعادة ضبط النظام</b><p class="muted">يعيد النسخة الافتراضية ويحذف التعديلات المحلية في هذا المتصفح.</p><button class="btn danger" id="reset">إعادة الضبط</button></div>`;document.getElementById('export').onclick=async()=>{
 const button=document.getElementById('export');button.disabled=true;button.textContent='جارِ تصغير اللوغوات...';
 try{
  const copy=JSON.parse(JSON.stringify(S));
  const targets=[copy.branding,...copy.items].filter(Boolean);
  for(const obj of targets)for(const key of ['logo','loginLogo','siteLogo']){
   if(typeof obj[key]==='string'&&obj[key].startsWith('data:image/')){

   }
  }
  const blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'});
  if(blob.size>24*1024*1024){toast('ملف البيانات ما زال كبيراً. راجع الصور القديمة أو حجم البيانات');return}
  S=copy;save();
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('تم تصغير اللوغوات وتصدير ملف البيانات');
 }catch(e){toast('تعذّر تصدير الملف')}finally{button.disabled=false;button.textContent='⬇ تصدير نسخة احتياطية JSON'}
};document.getElementById('import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!n.users||!n.items||!n.branding)throw 0;S=n;save();toast('تمت الاستعادة');closeModal();render()}catch(_){toast('ملف النسخة غير صالح')}};r.readAsText(f)};document.getElementById('reset').onclick=()=>{if(confirm('متأكد من إعادة ضبط النظام؟')){S=defaultState();save();user=S.users[0];closeModal();render()}}}
function previewAdmin(b){const others=S.users.filter(u=>!u.owner);b.innerHTML=others.length?`<p class="muted">اختر مستخدماً لترى بالضبط العناصر التي ستظهر له، بدون تسجيل خروج.</p><div class="list">${others.map(u=>`<div class="row"><div class="grow"><b>${esc(u.username)}</b></div><button class="btn goldbtn" data-prev="${u.id}">معاينة</button></div>`).join('')}</div>`:`<div class="empty">أضف مستخدماً أولاً حتى تستخدم المعاينة.</div>`;b.querySelectorAll('[data-prev]').forEach(x=>x.onclick=()=>{previewUser=S.users.find(u=>u.id===x.dataset.prev);path=[];closeModal();render()})}

function checkAdmin(b){const issues=[];S.items.filter(i=>i.active&&i.type==='link'&&!i.link).forEach(i=>issues.push('⚠ «'+i.name+'» بدون رابط'));S.items.filter(i=>i.active&&i.type==='dashboard'&&!S.items.some(x=>x.parent===i.id&&x.active)).forEach(i=>issues.push('⚠ الداشبورد «'+i.name+'» فارغ'));S.users.filter(u=>!u.owner&&!S.items.some(i=>i.active&&i.allowed.includes(u.id))).forEach(u=>issues.push('⚠ المستخدم «'+u.username+'» لا يملك صلاحية لأي عنصر'));S.items.filter(i=>!i.active).forEach(i=>issues.push('ℹ العنصر «'+i.name+'» مخفي'));b.innerHTML=`<div class="note">فحص سريع للإعدادات قبل النسخ الاحتياطي أو الرفع إلى GitHub. لا يغيّر أي شيء.</div><div class="list">${issues.length?issues.map(x=>`<div class="row"><div class="grow">${esc(x)}</div></div>`).join(''):'<div class="empty">✓ لم يتم العثور على ملاحظات واضحة.</div>'}</div>`}
function logsAdmin(b){const logs=Array.isArray(S.logs)?S.logs:[];b.innerHTML=`<div class="note">آخر 20 تغييراً مسجلاً محلياً للمالك.</div><div class="list">${logs.length?logs.map(l=>`<div class="row"><div class="grow"><b>${esc(l.text)}</b><small class="muted" style="display:block">${new Date(l.at).toLocaleString('ar-IQ')}</small></div></div>`).join(''):'<div class="empty">لا توجد تغييرات مسجلة بعد.</div>'}</div>`}
async function readImage(file,cb){
  if(!file)return;
  if(!file.type.startsWith('image/'))return toast('اختر ملف صورة صالح');
  if(file.size>20*1024*1024)return toast('الصورة كبيرة جداً. اختر صورة أقل من 20MB');
  const url=URL.createObjectURL(file);
  try{
    cb(await compressLogo(url));
  }catch(e){toast('تعذّر تصغير الصورة. جرّب صورة PNG أو JPG أو WebP')}finally{URL.revokeObjectURL(url)}
}
async function compressLogo(src){
    const img=new Image();img.src=src;await img.decode();
    const ratio=Math.min(1,160/Math.max(img.naturalWidth,img.naturalHeight));
    let width=Math.max(1,Math.round(img.naturalWidth*ratio)),height=Math.max(1,Math.round(img.naturalHeight*ratio));
    const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');
    if(!ctx)throw Error('canvas');
    let result='';
    for(let attempt=0;attempt<5;attempt++){
      canvas.width=width;canvas.height=height;
      ctx.clearRect(0,0,width,height);
      ctx.drawImage(img,0,0,width,height);
      const webp=canvas.toDataURL('image/webp',.62);
      const png=canvas.toDataURL('image/png');
      result=webp.startsWith('data:image/webp')&&webp.length<png.length?webp:png;
      if(result.length<35000||Math.max(width,height)<=64)break;
      width=Math.max(1,Math.round(width*.7));height=Math.max(1,Math.round(height*.7));
    }
    return result;
}function bindEyes(){document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);i.type=i.type==='password'?'text':'password'})}
function applyAppIcon(){
  const src=(S.branding&&S.branding.siteLogo)||'./icon-192.png';
  const fav=document.getElementById('favicon');if(fav)fav.href=src;
  const apple=document.getElementById('appleTouchIcon');if(apple)apple.href=src;
}
function revisionOf(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)+':'+text.length}
const APP_SOURCE_REVISION=revisionOf(document.querySelector('style').textContent+document.currentScript.textContent);
async function updatePublishedData(){
  try{
    const r=await fetch('./data.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)return false;
    const raw=await r.text(),revision=revisionOf(raw);
    let local=null;
    try{local=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
    if(localStorage.getItem(DATA_REVISION_KEY)===revision&&local&&Array.isArray(local.users)&&Array.isArray(local.items))return false;
    const n=JSON.parse(raw);
    if(!n||!Array.isArray(n.users)||!Array.isArray(n.items)||!n.branding)return false;
    S=n;
    if(save())localStorage.setItem(DATA_REVISION_KEY,revision);
    return true;
  }catch(e){return false}
}
let updating=false;
async function checkPublishedUpdates(){
  if(updating||document.hidden)return;
  updating=true;
  try{
    const url=new URL('./index.html',location.href);
    url.searchParams.set('check',Date.now());
    const r=await fetch(url,{cache:'no-store'});
    if(r.ok){
      const html=await r.text();
      const css=html.match(/<style>([\s\S]*?)<\/style>/);
      const js=html.match(/<script>([\s\S]*?)<\/script>/);
      if(css&&js&&revisionOf(css[1]+js[1])!==APP_SOURCE_REVISION){
        const next=new URL(location.href);
        next.searchParams.set('v',Date.now());
        location.replace(next.href);
        return;
      }
    }
    if(await updatePublishedData()){
      S.branding=S.branding||{};
      applyAppIcon();
      user=S.users.find(x=>x.id===user?.id)||null;
      previewUser=null;path=[];
      render();
      toast('تم تحديث بيانات البرنامج إلى النسخة المنشورة');
    }
  }catch(e){}finally{updating=false}
}
async function boot(){
  await updatePublishedData();
  S.branding=S.branding||{};
  S.branding.siteLogo=S.branding.siteLogo||'';
  S.branding.loginLogo=S.branding.loginLogo||'';
  S.logs=Array.isArray(S.logs)?S.logs:[];
  applyAppIcon();
  try{
    const remembered=JSON.parse(localStorage.getItem(REMEMBER_KEY)||'null');
    if(remembered&&remembered.until>Date.now())user=S.users.find(x=>x.id===remembered.id)||null;
    if(!user)localStorage.removeItem(REMEMBER_KEY);
  }catch(e){try{localStorage.removeItem(REMEMBER_KEY)}catch(_){}}
  render();
  setInterval(checkPublishedUpdates,2*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkPublishedUpdates()});
}boot();})();
